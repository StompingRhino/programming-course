<script>
'use strict';
// Глава 1, озвученная английская версия (только теория). Текст: content/programming-en/ch01/text.md,
// озвучка с метками: content/programming-en/ch01/narration.en.json (идентификаторы битов совпадают).
const CHAPTER = { number: 1, title: 'Algorithms: sequence, branching, repetition', language: 'en' };

/* ---------- помощники главы ---------- */
const txt = (p, str, x, y, t0, { size = 40, fill = COL.chalk, anchor = 'start', weight = 600 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };
const cnt = (p, x, y, pre, { size = 56, fill = PC.data, anchor = 'start' } = {}) => {            // счётчик с текстом «pre N»
  const e = T(p, pre + '0', { x, y, size, fill, weight: 700, anchor, o: 0 });
  return { e, set: (n, t) => prog(() => { e.textContent = pre + n; }, t, 0, lin) };
};
const nd = (p, t, ...a) => { const n = pgNode(p, ...a); show(n.g, t, .35); return n; };
const MAZE = {};
</script>
<script>
// Поля. Строки: . пусто, # камень, > v < ^ старт робота и его направление, F флажок, $ монета. Первая строка — верхний ряд.
MAZE.seq = pgMaze(['......', '.#F...', '......', '>.....']);   // B3 — камень, флажок на C3: в `order` робот упирается в него
MAZE.open = pgMaze(['......', '......', '......', '>.....']);
MAZE.exec = pgMaze(['.....F', '......', '......', '>.....']);
MAZE.rep = pgMaze(['.........', '>.......F']);
MAZE.sq = pgMaze(['>..', '...', '...']);
MAZE.rq = pgMaze(['......', '......', '......', '.>....']);
MAZE.corr = pgMaze(['..>....']);
MAZE.room = pgMaze(['...', '.>.', '...']);
MAZE.coins = pgMaze(['>$.$$.$']);
MAZE.bq = pgMaze(['.....', '..>#.', '.....']);
MAZE.combo = pgMaze(['>.....', '#####.', '##F##.', '##....']);
MAZE.fail = pgMaze(['>....', '..F..', '.....']);
const PROG = {
  seq: pgId(pgProg('FFLFF')), order: pgId(pgProg('FLFFF')), q: pgId(pgProg('FFLFLF')),
  sq: () => pgId([{ t: 'rep', n: 4, body: pgProg('FFR') }]),
  rq: () => pgId([{ t: 'rep', n: 3, body: pgProg('FFL') }]),
  combo: () => pgId([{ t: 'until', c: 'flag', body: [{ t: 'if', c: 'free', then: [{ t: 'F' }], else: [{ t: 'R' }] }] }]),
};
const rowsOf = prog => prog.map(n => ({ txt: PG_CMD[n.t], color: PC.cmd }));
PG_COND.rain = 'raining'; PG_CMD.U = 'take umbrella';
const PLAN = [
  { n: '1', t: 'What is an algorithm' }, { n: '2', t: 'Sequence' }, { n: '3', t: 'Visual programming' },
  { n: '4', t: 'Loops' }, { n: '5', t: 'Conditions' }, { n: '6', t: 'All together' }, { n: '7', t: 'Summary' }];
const partBeat = (id, title, hi) => [id, title, () => { pgAgenda(panel(0), PLAN, { hi, t0: .2 }); }];
const LIST = { x: 960, y: 170, w: 560 };
const fieldAt = (p, m, o = {}) => pgField(p, m, { x: 70, y: 170, cell: 135, coords: true, ...o });
// Строка правила-цепочки (шкала оценок): плашка с текстом, подсветка рамкой.
const ruleRow = (p, s, x, y, w, col, o = 0) => {
  const g = G(p, { x, y, o }), hl = G(g, { o: 0 });
  mk('rect', { width: w, height: 84, rx: 16, fill: PC.card, stroke: col, 'stroke-width': 5 }, g);
  mk('rect', { x: -8, y: -8, width: w + 16, height: 100, rx: 22, fill: 'none', stroke: COL.chalk, 'stroke-width': 7 }, hl);
  T(g, s, { x: 30, y: 58, size: 44, weight: 700, fill: COL.chalk });
  return { g, hl };
};

/* ---------- биты ---------- */
const BEATS = [
  /* ===== Part 1. What is an algorithm ===== */
  ['intro', 'Title', (m) => {
    const p = panel(0), g = G(p, { o: 0, y: 24 });
    T(g, 'Week 1 · Lesson 1', { x: 100, y: 230, size: 46, fill: COL.dim });
    T(g, 'Algorithms', { x: 100, y: 380, size: 150, weight: 800 });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    [['sequence', PC.cmd, 'seq'], ['branching', PC.cond, 'branch'], ['repetition', PC.loop, 'rep']].forEach(([s, c, mark], i) => {
      const b = pgPill(p, s, 1270, 560 + i * 115 + 30, c, PC.ink, { size: 46, h: 92, pad: 36 });
      tw(b, { o: 1, y: 560 + i * 115 }, m(mark), .5, out);
    });
  }],
  ['agenda', 'Lesson plan', (m) => {
    const p = panel(0), A = pgAgenda(p, PLAN, { hi: -1, t0: m('parts'), stagger: .09 });
    A.light(0, m('parts') + .9);
  }],
  ['everyday', 'Everyday instructions', (m) => {
    const p = panel(0);
    txt(p, 'Step-by-step instructions', 800, 110, .2, { size: 60, weight: 800, anchor: 'middle' });
    const cols = [
      ['lab', 'Lab method', ['1. Measure the reagent', '2. Mix with the sample', '3. Write down the result'], g => {
        mk('path', { d: 'M-30 25L-72 62Q-80 78 -62 78H62Q80 78 72 62L30 25Z', fill: PC.cmd }, g);
        path(g, 'M-30 -75V25L-72 62Q-80 78 -62 78H62Q80 78 72 62L30 25V-75M-48 -75H48', { stroke: COL.chalk, 'stroke-width': 8 });
      }],
      ['route', 'Route', ['1. Walk to the bus stop', '2. Take bus number 5', '3. Get off at stop 3'], g => {
        path(g, 'M-90 60Q-30 -20 20 30T90 -40', { stroke: COL.chalk, 'stroke-width': 8, 'stroke-dasharray': '4 18' });
        mk('circle', { cx: 90, cy: -50, r: 24, fill: PC.cmd }, g);
        mk('circle', { cx: -90, cy: 60, r: 14, fill: COL.chalk }, g);
      }],
      ['atm', 'Cash machine', ['1. Insert the card', '2. Enter the PIN', '3. Choose the amount', '4. Take card and cash'], g => {
        mk('rect', { x: -70, y: -70, width: 140, height: 100, rx: 12, fill: 'none', stroke: COL.chalk, 'stroke-width': 8 }, g);
        path(g, 'M-40 62H40', { stroke: COL.chalk, 'stroke-width': 10 });
        mk('rect', { x: -26, y: 44, width: 52, height: 34, rx: 6, fill: PC.cmd }, g);
      }]];
    cols.forEach(([mark, name, steps, icon], i) => {
      const cx = 290 + i * 510, g = G(p, { x: cx, y: 270 + 24, o: 0 });
      icon(g);
      const nm = T(p, name, { x: cx, y: 450, size: 56, weight: 700, anchor: 'middle', o: 0 });
      tw(g, { o: 1, y: 270 }, m(mark), .5, out); show(nm, m(mark) + .1);
      steps.forEach((s, k) => txt(p, s, cx - 215, 540 + k * 70, m(mark) + .3 + k * .22, { size: 40, weight: 500 }));
    });
  }],
  ['define', 'What an algorithm is', (m) => {
    const p = panel(0);
    txt(p, 'A recipe for tea', 120, 120, .2, { size: 64, weight: 700 });
    const steps = ['1. Boil the water', '2. Put a tea bag in a cup', '3. Pour in the boiling water', '4. Wait 3 minutes', '5. Add sugar to taste'];
    steps.forEach((s, i) => txt(p, s, 120, 235 + i * 78, m('steps') + i * .4, { size: 48 }));
    const x5 = 120 + uiW('5. Add ', 48), w5 = uiW('sugar to taste', 48);
    const fr = G(p, { o: 0 }); mk('rect', { x: x5 - 6, y: 235 + 4 * 78 - 58, width: w5 + 24, height: 84, rx: 14, fill: 'none', stroke: COL.bad, 'stroke-width': 7 }, fr);
    show(fr, m('vague'));
    const q = pgPill(p, 'how many spoons?', 1210, 235 + 4 * 78 - 12, COL.bad, PC.ink, { size: 44, h: 76 }); show(q, m('vague') + .4);
    const def = G(p, { o: 0, y: 20 });
    mk('rect', { x: 100, y: 640, width: 1400, height: 170, rx: 24, fill: PC.card, stroke: COL.chalk, 'stroke-width': 5 }, def);
    T(def, 'An algorithm is a precise, step-by-step procedure', { x: 800, y: 715, size: 48, weight: 700, anchor: 'middle' });
    T(def, 'for solving a problem or completing a task.', { x: 800, y: 780, size: 48, weight: 700, anchor: 'middle' });
    tw(def, { o: 1, y: 0 }, m('def'), .6, out);
  }],
  ['word', 'Where the word comes from', (m) => {
    const p = panel(0);
    txt(p, 'al-Khwarizmi', 800, 250, .2, { size: 96, weight: 800, anchor: 'middle' });
    txt(p, 'Baghdad, 9th century', 800, 330, .5, { size: 46, fill: COL.dim, anchor: 'middle' });
    const digits = '0123456789'.split('');
    digits.forEach((d, i) => { const e = T(p, d, { x: 800 + (i - 4.5) * 90, y: 520, size: 80, weight: 700, fill: PC.data, anchor: 'middle', o: 0 }); tw(e, { o: 1 }, m('book') + .3 + i * .08, .3); });
    txt(p, 'a book on calculating with the digits 0 to 9', 800, 600, m('book') + 1.2, { size: 42, fill: COL.dim, anchor: 'middle' });
    const chain = [['al-Khwarizmi', COL.chalk], ['Algoritmi', PC.cond], ['algorithm', PC.cmd]];
    const pills = chain.map(([s, c], i) => { const b = pgPill(p, s, 330 + i * 470, 760, PC.card, c, { size: 48, h: 92, pad: 34 }); tw(b, { o: 1 }, m('latin') + i * .7, .4); return b; });
    pills.slice(1).forEach((b, i) => { const a = pills[i]; pgArrow(p, [[st(a).x + a._w / 2 + 14, 760], [st(b).x - b._w / 2 - 14, 760]]).show(m('latin') + (i + 1) * .7 - .3, .3); });
  }],
  ['props', 'Properties of an algorithm', (m) => {
    const p = panel(0);
    txt(p, 'Properties of an algorithm', 800, 95, .2, { size: 56, weight: 800, anchor: 'middle' });
    [['exact', 'Precision', ['each step has', 'one meaning']], ['finite', 'Finiteness', ['it stops and', 'gives an answer']],
      ['mass', 'Generality', ['it solves a whole', 'class of problems']]].forEach(([mk_, name, ls], i) => {
      const x = 60 + i * 510, y = 200, g = G(p, { x, y: y + 20, o: 0 });
      mk('rect', { width: 480, height: 420, rx: 26, fill: PC.card, stroke: PC.edge, 'stroke-width': 5 }, g);
      T(g, name, { x: 240, y: 130, size: 56, weight: 700, anchor: 'middle' });
      ls.forEach((s, k) => T(g, s, { x: 240, y: 280 + k * 56, size: 40, fill: COL.dim, anchor: 'middle' }));
      tw(g, { o: 1, y }, m(mk_), .5, out);
    });
    txt(p, 'a web server runs for months by repeating', 800, 730, m('server'), { size: 40, fill: PC.cond, anchor: 'middle' });
    txt(p, 'a task that finishes each time', 800, 785, m('server') + .2, { size: 40, fill: PC.cond, anchor: 'middle' });
  }],
  ['props-q', 'Question: which property?', (m) => {
    const p = panel(0);
    txt(p, 'Which property is broken?', 100, 120, .2, { size: 56, weight: 700, fill: COL.dim });
    [['“Stir for a while”', 'Precision'], ['“Repeat: take a step forward”', 'Finiteness'], ['“Add 12 and 7: the answer is 19”', 'Generality']].forEach(([s, a], i) => {
      const y = 260 + i * 190;
      mk('rect', { x: 100, y: y - 70, width: 1400, height: 150, rx: 24, fill: PC.card, stroke: PC.edge, 'stroke-width': 4 }, p);
      txt(p, s, 140, y + 18, .3 + i * .2, { size: 46 });
      const tag = pgPill(p, a, 1280, y + 5, COL.bad, PC.ink, { size: 44, h: 80 }); put(tag, { x: 1460 - tag._w / 2 });
      tw(tag, { o: 1 }, m(['answer', 'a2', 'a3'][i]), .4);
    });
  }],
  ['executor', 'The executor and its commands', (m) => {
    const p = panel(0), F = pgField(p, MAZE.exec, { x: 70, y: 180 });
    ['forward', 'turn left', 'turn right'].forEach((s, i) => {
      const c = pgRect(p, 960, 170 + i * 90, 520, 72, PC.cmd, { o: 0 });
      T(c, s, { x: 260, y: 52, size: 44, fill: PC.ink, weight: 700, anchor: 'middle' });
      tw(c, { o: 1 }, m('cmds') + i * .6, .4);
    });
    const ask = pgPill(p, 'is the path ahead clear?', 1220, 560, PC.cond, PC.ink, { size: 40, h: 76 }); show(ask, m('ask'));
    const b = pgPill(p, 'go to the flag?', 1150, 670, '#3a5047', COL.chalk, { size: 44, h: 80, pad: 34 });
    tw(b, { o: 1 }, m('only'), .4);
    const x = pgCheckMark(p, 1150 + b._w / 2 + 56, 670, false, { r: 1.7 }); draw(x, m('only') + 1.2, .4);
    const br = path(p, 'M930 170V422', { stroke: PC.cmd, 'stroke-width': 9 }, { d: 0 }); draw(br, m('ski'), .5);
    txt(p, 'the command set', 1220, 475, m('ski'), { size: 42, weight: 700, fill: PC.cmd, anchor: 'middle' });
    txt(p, 'a computer is an executor too;', 1200, 790, m('computer'), { size: 40, fill: COL.dim, anchor: 'middle' });
    txt(p, 'a program: instructions in its language', 1200, 845, m('computer') + 1.5, { size: 40, fill: COL.dim, anchor: 'middle' });
  }],
  ['forms', 'Ways to write it down', (m) => {
    const p = panel(0);
    txt(p, 'Algorithm: “if it is raining, take an umbrella”', 800, 100, .2, { size: 50, weight: 700, anchor: 'middle' });
    const W = [320, 320, 320, 500], X = [40]; W.forEach((w, i) => i < 3 && X.push(X[i] + w + 20));
    [['words', 'In words'], ['chart', 'Flowchart'], ['blocks', 'Blocks'], ['code', 'Python code']].forEach(([mk_, name, ], i) => {
      const x = X[i], g = G(p, { x, y: 190 + 24, o: 0 });
      mk('rect', { width: W[i], height: 580, rx: 24, fill: PC.card, stroke: PC.edge, 'stroke-width': 5 }, g);
      T(g, name, { x: W[i] / 2, y: 70, size: 44, weight: 700, anchor: 'middle', fill: COL.dim });
      if (i === 0) ['If it is', 'raining,', 'take an', 'umbrella.'].forEach((s, k) => T(g, s, { x: 28, y: 190 + k * 62, size: 46 }));
      if (i === 1) {
        const d = pgNode(g, 'dia', 'raining?', 150, 210, { w: 250, h: 130, o: 1 }), r = pgNode(g, 'rect', 'umbrella', 150, 370, { w: 250, h: 70, o: 1 }), e = pgNode(g, 'oval', 'next', 150, 500, { w: 170, h: 60, o: 1 });
        [pgArrow(g, [d.bot, [150, 332]], { label: 'yes', lx: 40, ly: 30, o: 1 }), pgArrow(g, [r.bot, [150, 468]], { o: 1 }),
          pgArrow(g, [d.right, [296, 210], [296, 500], [240, 500]], { label: 'no', lx: -18, ly: -22, o: 1 })].forEach(a => { draw(a.line, 0, 0); a.lab && (st(a.lab).o = 1, render(a.lab)); });
      }
      if (i === 2) pgBlocks(g, [{ t: 'if', c: 'rain', then: [{ t: 'U' }], id: 0 }].map(n => (n.then[0].id = 1, n)), { x: 14, y: 150, w: 292, size: 34, h: 66 });
      if (i === 3) { T(g, 'if rain:', { x: 28, y: 190, size: 44, font: PG_MONO, fill: PC.cond, weight: 700 }); T(g, '    take_umbrella()', { x: 28, y: 260, size: 38, font: PG_MONO, fill: PC.cmd, weight: 700 }); }
      tw(g, { o: 1, y: 190 }, m(mk_), .5, out);
    });
  }],

  /* ===== Part 2. Sequence ===== */
  partBeat('part2', 'Part 2. Sequence', 1),
  ['sequence', 'A sequence', (m) => {
    const p = panel(0), F = fieldAt(p, MAZE.seq), L = pgList(p, rowsOf(PROG.seq), { ...LIST, title: 'Program' });
    const ev = pgExec(MAZE.seq, PROG.seq).evs, hook = (e, t) => e.t === 'act' && L.at(e.id, t, .15);
    tw(L.ptr, { o: 1 }, m('f1') - .01, .01);
    pgRun(F, ev, m('f1'), { per: .6, to: 2, on: hook });
    pgRun(F, ev, m('l'), { per: .6, from: 2, to: 3, on: hook });
    const end = pgRun(F, ev, m('f2'), { per: .6, from: 3, on: hook });
    L.off(end + .1);
    show(F.ring(2, 1), m('done')); pulse(F.flag, m('done') + .1, 1.4);
  }],
  ['trace', 'Tracing', (m) => {
    const p = panel(0), F = fieldAt(p, MAZE.seq), r = pgExec(MAZE.seq, PROG.seq), mz = MAZE.seq;
    const cols = [950, 1040, 1290, 1420], rowH = 70, y0 = 210;
    ['step', 'command', 'cell', 'faces'].forEach((s, i) => txt(p, s, cols[i], y0, .3, { size: 38, fill: COL.dim, weight: 700 }));
    mk('rect', { x: 935, y: y0 + 18, width: 620, height: 5, fill: PC.edge }, p);
    const row = (k, cmd, x, y, d, t) => {
      const g = G(p, { y: y0 + 20 + (k + 1) * rowH - 8, o: 0 });
      [`${k}`, cmd, pgCell(mz, x, y), pgArrowCh(d)].forEach((s, i) => T(g, s, { x: cols[i], size: 44, weight: 600, fill: i === 1 ? (k ? PC.cmd : PC.meta) : COL.chalk }));
      show(g, t, .25);
    };
    row(0, 'start', mz.start.x, mz.start.y, mz.start.d, .5);
    const per = pgPer(5, m('rows'), m('rows') + 4.5, .55);
    const acts = r.evs.filter(e => e.t === 'act');
    pgRun(F, r.evs, m('rows'), { per, on: (e, t) => { const k = acts.indexOf(e) + 1; row(k, PG_CMD[e.c], e.x, e.y, e.d, t + per * .8); } });
  }],
  ['seq-q', 'Question: where will the robot end up?', (m) => {
    const p = panel(0), F = fieldAt(p, MAZE.open), L = pgList(p, rowsOf(PROG.q), { ...LIST, title: 'Program' });
    txt(p, 'Where will the robot end up', 960, 740, .4, { size: 44, weight: 700 }); txt(p, 'and which way will it face?', 960, 795, .4, { size: 44, weight: 700 });
    const r = pgExec(MAZE.open, PROG.q), end = pgRun(F, r.evs, m('answer'), { per: 1.1, on: (e, t) => L.at(e.id, t, .12) });
    L.off(end + .1);
    show(F.ring(r.end.x, r.end.y), end);
    txt(p, `Cell ${pgCell(MAZE.open, r.end.x, r.end.y)}, facing ${pgDirName(r.end.d)}`, 960, 860, end + .3, { size: 46, fill: PC.flag, weight: 700 });
  }],
  ['order', 'Order matters', (m) => {
    const p = panel(0), F = fieldAt(p, MAZE.seq), L = pgList(p, rowsOf(PROG.order), { ...LIST, title: 'Program' });
    const sw = path(p, 'M1555 345V415M1539 361L1555 341L1571 361M1539 399L1555 419L1571 399', { stroke: COL.chalk, 'stroke-width': 6 }, { o: 0 }); show(sw, .4);
    const r = pgExec(MAZE.seq, PROG.order), ci = r.evs.findIndex(e => e.crash);
    pgRun(F, r.evs, m('run'), { per: .9, to: ci, on: (e, t) => e.t === 'act' && L.at(e.id, t, .15) });
    const t = m('wall');
    pgRun(F, r.evs, t, { per: .7, from: ci, to: ci + 1, on: (e, tt) => { L.at(e.id, tt, .15); L.bad(e.id, tt + .3); } });
    const cr = pgCheckMark(p, 70 + F.pos(1, 1)[0], 170 + F.pos(1, 1)[1], false, { r: 1.7 }); draw(cr, t + .5, .4);
    txt(p, 'a stone!', 960, 720, t + .6, { size: 56, weight: 700, fill: COL.bad });
    txt(p, 'a mistake in a program: a bug', 960, 790, m('bug'), { size: 40, fill: COL.dim });
    txt(p, 'finding and fixing it: debugging', 960, 845, m('bug') + 1.2, { size: 40, fill: COL.dim });
  }],
  ['flowchart', 'Flowchart', (m) => {
    const p = panel(0), L = pgList(p, rowsOf(PROG.seq), { x: 1000, y: 170, w: 520, title: 'Program' });
    const lg = [['oval', 'start, end', 230, 250], ['rect', 'action', 230, 410], ['dia', 'condition', 230, 600]];
    const legs = lg.map(([k, s, x, y], i) => { const n = pgNode(p, k, s, x, y, k === 'dia' ? { w: 340, h: 150, size: 40 } : { w: 340, size: 40 }); tw(n.g, { o: k === 'dia' ? .35 : 1 }, .3 + i * .3, .4); return n; });
    txt(p, 'for branching', 230, 715, 1.2, { size: 38, fill: COL.dim, anchor: 'middle' });
    const cx = 700, ys = [120, 235, 345, 455, 565, 675], nodes = [];
    const lab = ['forward', 'forward', 'turn left', 'forward', 'forward'];
    const start = nd(p, m('map'), 'oval', 'start', cx, ys[0], { w: 260 });
    lab.forEach((s, i) => { const n = pgNode(p, 'rect', s, 1260, 170 + 18 + i * 66 + 33, { w: 260, h: 60 }); tw(n.g, { x: cx, y: ys[i + 1], o: 1 }, m('map') + .4 + i * .3, .55); nodes.push(n); });
    nd(p, m('map') + 2, 'oval', 'end', cx, 790, { w: 260 });
    [start, ...nodes, 0].forEach((_, i, a) => {
      if (i === a.length - 1) return;
      const f = [cx, (i === 0 ? ys[0] : ys[i]) + 38], t = [cx, i === a.length - 2 ? 790 - 38 : ys[i + 1] - 40];
      pgArrow(p, [f, t]).show(m('arrows') + i * .15, .25);
    });
    legs.forEach(n => tw(n.g, { o: .35 }, m('map'), .4));
    tw(L.g, { o: .6 }, m('map') + .6, .4);
  }],

  /* ===== Part 3. Visual programming ===== */
  ['visual', 'A program made of blocks', (m) => {
    const p = panel(0), L = pgList(p, rowsOf(PROG.seq), { x: 80, y: 190, w: 640, size: 46, rowH: 85, title: 'List' });

  /* ===== Part 7. Summary ===== */
  ['to-text', 'From blocks to text', (m) => {
    const p = panel(0), prog = PROG.combo(), B = pgBlocks(p, prog, { x: 70, y: 200, w: 560, o: 0 }); show(B.g, .3);

    const lines = [['while not at_flag():', 0, PC.loop, 0], ['if path_ahead():', 1, PC.cond, 1], ['forward()', 2, PC.cmd, 2], ['else:', 1, PC.cond, 1], ['turn_right()', 2, PC.cmd, 3]];
    lines.forEach(([s, ind, col, id], i) => {
      const y = 245 + i * 72, e = T(p, s, { x: 780 + ind * 4 * cw, y, size: 44, font: PG_MONO, weight: 700, fill: COL.chalk, o: 0 });

    const bar = (ind, a, b, col) => { const r = G(p, { o: 0 }); mk('rect', { x: 770 + ind * 4 * cw - 2, y: 245 + a * 72 - 44, width: 12, height: (b - a) * 72 + 62, rx: 5, fill: col }, r); return r; };
    [bar(0, 1, 4, PC.loop), bar(1, 2, 2, PC.cond), bar(1, 4, 4, PC.cond)].forEach((r, i) => show(r, m('indent') + i * .6));
    txt(p, 'the function names are made up', 740, 660, m('made'), { size: 40, fill: COL.dim });
  }],
  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    txt(p, 'Summary', 100, 120, .2, { size: 68, weight: 800 });
    [['Algorithm', 'precise steps that solve a problem', 'w1', COL.chalk],
      ['Sequence', 'commands one after another', 'w2', PC.cmd],
      ['Loop', 'N times, or while a condition holds', 'w3', PC.loop],
      ['Condition', 'a yes or no question that chooses', 'w4', PC.cond],
      ['Tracing', 'the computer does what is written', 'w5', PC.meta]].forEach(([a, b, mark, col], i) => {
      const g = G(p, { y: 270 + i * 130, o: 0 });
      T(g, a, { x: 100, size: 52, weight: 800, fill: col }); T(g, b, { x: 620, size: 46, fill: COL.dim });
      show(g, m(mark));

  }],
  ['next', 'Next lesson', (m) => {
    const p = panel(0);
    txt(p, 'Lesson 2: Python', 100, 200, .2, { size: 76, weight: 800 });
    txt(p, 'values, variables, numbers, strings, input and output', 100, 290, .4, { size: 46, fill: COL.dim });
    const bx = (s, x, col, t) => { const b = pgRect(p, x - 190, 470, 380, 130, col, { o: 0 }); T(b, s, { x: 190, y: 82, size: 56, fill: PC.ink, weight: 800, anchor: 'middle' }); tw(b, { o: 1 }, t, .4); return b; };
    bx('input', 300, PC.meta, m('io')); bx('processing', 800, PC.cmd, m('io') + .6); bx('output', 1300, PC.meta, m('io') + 1.2);
    pgArrow(p, [[500, 535], [590, 535]]).show(m('io') + .4, .3); pgArrow(p, [[1000, 535], [1090, 535]]).show(m('io') + 1, .3);
    const v = pgRect(p, 600, 700, 400, 120, PC.card, { stroke: PC.data, sw: 7, o: 0 }); T(v, 'coins: 4', { x: 200, y: 78, size: 54, fill: PC.data, weight: 800, anchor: 'middle' }); show(v, m('box'));
  }],
].map(([id, title, run, extra]) => ({ id, title, run, lead: false, ...extra }));   // lead:false — все биты открываются сразу, ничего не сдвигать к началу
